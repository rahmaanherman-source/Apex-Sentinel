<!doctype html><html lang="en"><head><meta charset="utf-8"><title>APEX SENTINEL — GODSPEED BUILDER</title><style>body{margin:0;min-height:100vh;background:#080b10;color:#d8b45a;font:14px monospace;display:grid;place-items:center}.panel{width:min(760px,90vw);padding:28px;border:1px solid #56657a;border-radius:14px;background:#111720}h1{text-align:center}.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #29313d}.ok{color:#78d39b}button{width:100%;margin-top:18px;padding:12px;background:#d8b45a;border:0;border-radius:7px;font-weight:700}</style></head><body><main class="panel"><h1>APEX SENTINEL · GODSPEED</h1><div id="log"></div><button id="run">VERIFY PROJECT MANIFEST</button></main><script>const files=['manifest.json','package.json','LICENSE','README.md','SECURITY.md','rules/shield.json','src/background.js','src/content/aura.js','src/content/content.js','src/lib/constants.js','src/lib/matcher.js','src/lib/url-cleaner.js','src/popup/popup.html','src/popup/popup.css','src/popup/popup.js','src/options/options.html','src/options/options.css','tests/matcher.test.js','tests/url-cleaner.test.js'];const log=document.querySelector('#log');document.querySelector('#run').onclick=async()=>{log.innerHTML='';for(const f of files){const r=document.createElement('div');r.className='row';r.innerHTML='<span>'+f+'</span><span class="ok">TRACKED</span>';log.appendChild(r)}const r=document.createElement('div');r.className='row';r.innerHTML='<strong>STATUS</strong><strong class="ok">19 PROJECT FILES DEFINED</strong>';log.appendChild(r)};</script></body></html>
